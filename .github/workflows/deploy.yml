name: Deploy Furia Motor

on:
  push:
    branches:
      - master
      - ia-desarrollo

jobs:
  deploy-development:
    name: Deploy a Desarrollo
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/ia-desarrollo'
    
    steps:
      - name: Deploy to Development
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            echo "🚀 Desplegando en DESARROLLO..."
            
            # ============================================
            # 1. ACTUALIZAR TODO EL REPOSITORIO
            # ============================================
            cd /home/vania/apps/taller-desarrollo
            echo "📥 Pull de cambios..."
            git pull origin ia-desarrollo
            
            # ============================================
            # 2. BACKEND
            # ============================================
            echo "🐍 Activando virtualenv..."
            source /home/vania/apps/taller-desarrollo/venv/bin/activate
            echo "📦 Instalando dependencias..."
            pip install -r backend/requirements.txt
            echo "🔄 Reiniciando Gunicorn..."
            sudo systemctl restart taller-dev
            
            # ============================================
            # 3. RECARGAR NGINX (para que tome los cambios del frontend)
            # ============================================
            echo "🔄 Recargando Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Despliegue en DESARROLLO completado!"
            echo "🌐 https://dev.furiamotorcompany.com"

  deploy-production:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            echo "🚀 Desplegando en PRODUCCIÓN..."
            
            # ============================================
            # 1. ACTUALIZAR TODO EL REPOSITORIO
            # ============================================
            cd /home/vania/apps/taller
            echo "📥 Pull de cambios..."
            git pull origin master
            
            # ============================================
            # 2. BACKEND
            # ============================================
            echo "🐍 Activando virtualenv..."
            source /home/vania/apps/taller/venv/bin/activate
            echo "📦 Instalando dependencias..."
            pip install -r backend/requirements.txt
            echo "🔄 Reiniciando Gunicorn..."
            sudo systemctl restart taller-prod
            
            # ============================================
            # 3. RECARGAR NGINX (para que tome los cambios del frontend)
            # ============================================
            echo "🔄 Recargando Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Despliegue en PRODUCCIÓN completado!"
            echo "🌐 https://www.furiamotorcompany.com"