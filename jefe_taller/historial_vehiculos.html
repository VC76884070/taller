<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Historial de Vehículos | FURIA MOTOR - Jefe Taller</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/jefe_taller/css/dashboard.css">
    <link rel="stylesheet" href="/jefe_taller/css/historial_vehiculos.css">

    <!-- ========== CONFIGURACIÓN PWA (ICONO TORQUE) ========== -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#C1121F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TORQUE">

    <!-- ICONO PARA LA PESTAÑA DEL NAVEGADOR -->
    <link rel="icon" type="image/png" href="/icono.png">
    <link rel="shortcut icon" type="image/png" href="/icono.png">

    <!-- ICONO PARA IPHONE / IPAD (pantalla de inicio) -->
    <link rel="apple-touch-icon" href="/icono.png">

    <!-- ICONO PARA ANDROID (chrome) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icono.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icono.png">
    <!-- ===================================================== -->
</head>

<body>
    <!-- ========== BOTÓN HAMBURGUESA PARA MÓVIL/TABLET ========== -->
    <button class="hamburger-menu" id="hamburgerMenu" aria-label="Menú">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ========== OVERLAY PARA CERRAR SIDEBAR ========== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1><i class="fas fa-history"></i> Historial de Vehículos</h1>
                    <p>Consulta el historial completo de servicios por vehículo</p>
                </div>
                <div class="top-actions">
                    <div class="date-display">
                        <i class="far fa-calendar-alt"></i>
                        <span id="currentDate"></span>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="historial-container">

                    <!-- ============ PANEL DE BÚSQUEDA ============ -->
                    <div class="busqueda-panel">
                        <div class="busqueda-grid">
                            <div class="form-group">
                                <label><i class="fas fa-search"></i> Buscar por placa</label>
                                <input type="text" id="searchPlaca" class="form-input"
                                       placeholder="Ej: 123ABC, 456DEF" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-filter"></i> Filtrar por estado</label>
                                <select id="filterEstado" class="form-select">
                                    <option value="">Todos</option>
                                    <option value="Entregado">Entregados</option>
                                    <option value="Finalizado">Finalizados</option>
                                    <option value="EnReparacion">En Reparación</option>
                                    <option value="EnDiagnostico">En Diagnóstico</option>
                                    <option value="EnRecepcion">En Recepción</option>
                                    <option value="EnPausa">En Pausa</option>
                                    <option value="ReparacionCompletada">Reparación Completada</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> Desde</label>
                                <input type="date" id="fechaDesde" class="form-input">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> Hasta</label>
                                <input type="date" id="fechaHasta" class="form-input">
                            </div>
                            <button class="btn-buscar" id="btnBuscar">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                            <button class="btn-limpiar" id="btnLimpiar">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                        </div>
                    </div>

                    <!-- ============ RESULTADOS ============ -->
                    <div id="resultadosContainer">
                        <div class="loading-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Cargando últimas órdenes...</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- ============ MODAL DETALLE COMPLETO (5 TABS) ============ -->
    <div class="modal" id="modalDetalleOrden">
        <div class="modal-content modal-xl">
            <div class="modal-header">
                <h2><i class="fas fa-clipboard-list"></i> Detalle Completo de Orden</h2>
                <button class="modal-close" onclick="cerrarModalDetalle()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Tabs dentro del modal -->
                <div class="modal-tabs">
                    <button class="modal-tab active" data-tab="cliente-vehiculo">
                        <i class="fas fa-user-circle"></i> Cliente & Vehículo
                    </button>
                    <button class="modal-tab" data-tab="recepcion">
                        <i class="fas fa-clipboard-list"></i> Recepción
                    </button>
                    <button class="modal-tab" data-tab="diagnosticos">
                        <i class="fas fa-microscope"></i> Diagnósticos
                    </button>
                    <button class="modal-tab" data-tab="servicios">
                        <i class="fas fa-tools"></i> Servicios & Avances
                    </button>
                    <button class="modal-tab" data-tab="timeline">
                        <i class="fas fa-stream"></i> Timeline
                    </button>
                </div>

                <div id="tab-cliente-vehiculo" class="modal-tab-content active">
                    <div id="clienteVehiculoContent"></div>
                </div>
                <div id="tab-recepcion" class="modal-tab-content">
                    <div id="recepcionContent"></div>
                </div>
                <div id="tab-diagnosticos" class="modal-tab-content">
                    <div id="diagnosticosContent"></div>
                </div>
                <div id="tab-servicios" class="modal-tab-content">
                    <div id="serviciosContent"></div>
                </div>
                <div id="tab-timeline" class="modal-tab-content">
                    <div id="timelineContent"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-pdf" id="btnGenerarPDF">
                    <i class="fas fa-file-pdf"></i> Descargar PDF
                </button>
                <button class="btn-secondary" onclick="cerrarModalDetalle()">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- ============ MODAL IMAGEN AMPLIADA ============ -->
    <div class="modal" id="modalImagen">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2><i class="fas fa-image"></i> <span id="imagenTitulo">Imagen</span></h2>
                <button class="modal-close" onclick="cerrarModalImagen()">&times;</button>
            </div>
            <div class="modal-body">
                <img id="imagenAmpliada" src="" alt="Imagen ampliada"
                     style="width: 100%; border-radius: var(--radius-md);">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModalImagen()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="/jefe_taller/js/include.js"></script>
    <script src="/jefe_taller/js/historial_vehiculos.js"></script>

    <!-- ========== SCRIPT RESPONSIVE PARA SIDEBAR ========== -->
    <script>
        let sidebarOpen = false;

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerMenu');
            const body = document.body;
            if (!sidebar) return;
            sidebarOpen = !sidebarOpen;
            if (sidebarOpen) {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('active');
                if (hamburger) hamburger.classList.add('active');
                body.classList.add('sidebar-open');
                const icon = hamburger.querySelector('i');
                if (icon) icon.className = 'fas fa-times';
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerMenu');
            const body = document.body;
            if (sidebar) {
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('active');
                if (hamburger) hamburger.classList.remove('active');
                body.classList.remove('sidebar-open');
                const icon = hamburger.querySelector('i');
                if (icon) icon.className = 'fas fa-bars';
            }
            sidebarOpen = false;
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('hamburgerMenu')?.addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);

            window.addEventListener('resize', function () {
                if (window.innerWidth > 1024 && sidebarOpen) closeSidebar();
            });

            document.addEventListener('click', function (e) {
                if (window.innerWidth <= 1024 && sidebarOpen) {
                    const sidebar = document.querySelector('.sidebar');
                    const hamburger = document.getElementById('hamburgerMenu');
                    if (sidebar && !sidebar.contains(e.target) && hamburger && !hamburger.contains(e.target)) {
                        closeSidebar();
                    }
                }
            });

            document.addEventListener('touchmove', function (e) {
                if (window.innerWidth <= 1024 && sidebarOpen) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar && !sidebar.contains(e.target)) {
                        e.preventDefault();
                    }
                }
            });
        });

        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;

        console.log('✅ historial_vehiculos.html (Jefe Taller) - Funciones responsive cargadas');
    </script>
    <script src="/register_sw.js"></script>
</body>

</html>
