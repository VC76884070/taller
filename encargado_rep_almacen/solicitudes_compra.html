<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Solicitudes de Compra | Encargado Repuestos - FURIA MOTOR</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS para OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/solicitudes_compra.css">

    <!-- ========== CONFIGURACIÓN PWA ========== -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#C1121F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TORQUE">

    <link rel="icon" type="image/png" href="/icono.png">
    <link rel="shortcut icon" type="image/png" href="/icono.png">
    <link rel="apple-touch-icon" href="/icono.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icono.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icono.png">
</head>

<body>
    <!-- Botón hamburguesa para móvil/tablet -->
    <button class="hamburger-menu" id="hamburgerMenu" aria-label="Menú">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Overlay para cerrar sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="top-bar">
                <div class="page-title">
                    <h1><i class="fas fa-shopping-cart" style="color: var(--rojo-primario); margin-right: 0.5rem;"></i> Solicitudes de Compra</h1>
                    <p>Gestiona las compras de repuestos solicitadas por el Jefe de Taller</p>
                </div>
                <div class="top-actions">
                    <div class="date-display">
                        <i class="far fa-calendar-alt"></i>
                        <span id="currentDate"></span>
                    </div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filtros-bar">
                <select id="filtroEstado">
                    <option value="all">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="comprado">Comprados</option>
                    <option value="entregado">Entregados</option>
                </select>
                <input type="text" id="searchInput" placeholder="Buscar por orden o repuesto...">
                <button id="refreshBtn" class="btn-secondary">
                    <i class="fas fa-sync-alt"></i> Actualizar
                </button>
            </div>

            <!-- Contenedor de solicitudes -->
            <div id="solicitudesContainer"></div>
        </main>
    </div>

    <!-- ===================================================== -->
    <!-- 🔥 MODAL PARA MARCAR COMO COMPRADO (SIN MAPA) -->
    <!-- ===================================================== -->
    <div id="modalComprar" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Registrar Compra</h3>
                <span class="modal-close" onclick="cerrarModal('modalComprar')">&times;</span>
            </div>
            <div id="modalComprarBody" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal('modalComprar')">Cancelar</button>
                <button class="btn-primary" onclick="confirmarCompra()">
                    <i class="fas fa-check"></i> Confirmar Compra
                </button>
            </div>
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- 🔥 MODAL PARA REGISTRAR ENTREGA -->
    <!-- ===================================================== -->
    <div id="modalEntregar" class="modal">
        <div class="modal-content modal-md">
            <div class="modal-header">
                <h3><i class="fas fa-truck"></i> Registrar Entrega</h3>
                <span class="modal-close" onclick="cerrarModal('modalEntregar')">&times;</span>
            </div>
            <div id="modalEntregarBody" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal('modalEntregar')">Cancelar</button>
                <button class="btn-primary" onclick="confirmarEntrega()" style="background:var(--verde-exito);">
                    <i class="fas fa-check"></i> Confirmar Entrega
                </button>
            </div>
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- 🔥 MODAL PARA VER DETALLE -->
    <!-- ===================================================== -->
    <div id="modalDetalle" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-info-circle"></i> Detalle de Solicitud</h3>
                <span class="modal-close" onclick="cerrarModal('modalDetalle')">&times;</span>
            </div>
            <div id="modalDetalleBody" class="modal-body"></div>
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- 🔥 MODAL PARA VER COMPROBANTE -->
    <!-- ===================================================== -->
    <div id="modalVerComprobante" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-receipt"></i> Comprobante de Compra</h3>
                <span class="modal-close" onclick="cerrarModal('modalVerComprobante')">&times;</span>
            </div>
            <div id="modalVerComprobanteBody" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal('modalVerComprobante')">Cerrar</button>
                <a id="descargarComprobanteBtn" class="btn-primary" href="#" target="_blank">
                    <i class="fas fa-download"></i> Descargar
                </a>
            </div>
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- 🔥 MODAL DE NUEVO PROVEEDOR (CON MAPA) -->
    <!-- ===================================================== -->
    <div id="modalProveedorCompra" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 id="modalTitleProveedorCompra"><i class="fas fa-truck"></i> Nuevo Proveedor</h3>
                <span class="modal-close" onclick="cerrarModalProveedorCompra()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="proveedorFormCompra" novalidate>
                    <input type="hidden" id="proveedorIdCompra" value="">
                    <input type="hidden" id="latitudCompra" value="-17.7835">
                    <input type="hidden" id="longitudCompra" value="-63.1821">

                    <!-- Fila 1: Nombre y Propietario -->
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-building"></i> Nombre *</label>
                            <input type="text" id="nombreCompra" required placeholder="Ej: Autorepuestos López">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Propietario</label>
                            <input type="text" id="propietarioCompra" placeholder="Nombre del representante">
                        </div>
                    </div>

                    <!-- Fila 2: Teléfono y Descripción -->
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Teléfono *</label>
                            <input type="tel" id="telefonoCompra" required placeholder="Ej: 71234567">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-tags"></i> Repuestos que ofrece</label>
                            <input type="text" id="descripcionCompra" placeholder="Ej: Motores, frenos, suspensión...">
                        </div>
                    </div>

                    <!-- ===================================================== -->
                    <!-- 🔥 MAPA Y UBICACIÓN GPS (AQUÍ DENTRO) -->
                    <!-- ===================================================== -->
                    <div class="form-group">
                        <label><i class="fas fa-map-marked-alt"></i> Ubicación GPS</label>
                        <div id="mapContainerCompra"></div>

                        <div class="ubicacion-info">
                            <i class="fas fa-map-pin"></i>
                            <span>Coordenadas: </span>
                            <span id="coordsDisplayCompra" class="coords">-17.7835, -63.1821</span>
                        </div>

                        <div class="coords-input-group">
                            <div class="form-group" style="flex:1; margin-bottom:0;">
                                <input type="text" id="ubicacion_gps_compra" placeholder="O ingresa coordenadas manualmente">
                            </div>
                        </div>

                        <div class="ubicacion-actions">
                            <button type="button" class="btn-sm" onclick="obtenerUbicacionActualCompra()">
                                <i class="fas fa-location-dot"></i> Mi Ubicación
                            </button>
                            <button type="button" class="btn-sm" onclick="if(window.mapCompra){window.mapCompra.setView([DEFAULT_LAT_COMPRA, DEFAULT_LNG_COMPRA], 14); if(window.mapMarkerCompra){window.mapMarkerCompra.setLatLng([DEFAULT_LAT_COMPRA, DEFAULT_LNG_COMPRA]); actualizarCoordenadasCompra(DEFAULT_LAT_COMPRA, DEFAULT_LNG_COMPRA);}}">
                                <i class="fas fa-home"></i> Predeterminada
                            </button>
                            <button type="button" class="btn-sm" onclick="if(window.mapCompra){window.mapCompra.invalidateSize();}">
                                <i class="fas fa-expand"></i> Ajustar
                            </button>
                        </div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="cerrarModalProveedorCompra()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn-primary" id="btnGuardarProveedorCompra">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- 🔥 MODAL PARA FOTO AMPLIADA -->
    <!-- ===================================================== -->
    <div id="modalFotoAmpliadaEncargado" class="modal" onclick="cerrarFotoAmpliadaEncargado()">
        <div class="modal-content" style="max-width: 900px; max-height: 95vh;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3><i class="fas fa-image"></i> Foto del Repuesto</h3>
                <button class="modal-close" onclick="cerrarFotoAmpliadaEncargado()">&times;</button>
            </div>
            <div class="modal-body" style="display:flex; justify-content:center; align-items:center; padding:1.5rem; background:var(--negro); min-height:300px; position:relative;">
                <div id="fotoModalLoaderEncargado" style="position:absolute; display:flex; align-items:center; justify-content:center; width:100%; height:100%;">
                    <i class="fas fa-spinner fa-spin" style="font-size:3rem; color:var(--gris-texto);"></i>
                </div>
                <img id="fotoAmpliadaEncargadoImg" src="" alt="Foto ampliada" loading="lazy" 
                     style="max-width:100%; max-height:75vh; object-fit:contain; border-radius:var(--radius-md); display:none;">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarFotoAmpliadaEncargado()">Cerrar</button>
                <button class="btn-primary" onclick="descargarFotoAmpliadaEncargado()">
                    <i class="fas fa-download"></i> Descargar
                </button>
            </div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Cargando...</p>
    </div>

    <!-- ===================================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================================== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/include.js"></script>
    <script src="js/solicitudes_compra.js"></script>

    <!-- ===================================================== -->
    <!-- 🔥 FUNCIONES RESPONSIVE Y DE MAPA -->
    <!-- ===================================================== -->
    <script>
        // =====================================================
        // FUNCIONES RESPONSIVE PARA SIDEBAR
        // =====================================================
        let sidebarOpen = false;

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerMenu');
            const body = document.body;

            if (!sidebar) return;

            sidebarOpen = !sidebarOpen;

            if (sidebarOpen) {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('active');
                if (hamburger) hamburger.classList.add('active');
                body.style.overflow = 'hidden';
                const icon = hamburger.querySelector('i');
                if (icon) icon.className = 'fas fa-times';
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerMenu');
            const body = document.body;

            if (sidebar) {
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('active');
                if (hamburger) hamburger.classList.remove('active');
                body.style.overflow = '';
                const icon = hamburger.querySelector('i');
                if (icon) icon.className = 'fas fa-bars';
            }
            sidebarOpen = false;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const hamburgerBtn = document.getElementById('hamburgerMenu');
            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', toggleSidebar);
            }

            const overlay = document.getElementById('sidebarOverlay');
            if (overlay) {
                overlay.addEventListener('click', closeSidebar);
            }

            window.addEventListener('resize', function() {
                if (window.innerWidth > 1024 && sidebarOpen) {
                    closeSidebar();
                }
            });

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 1024 && sidebarOpen) {
                    const sidebar = document.querySelector('.sidebar');
                    const hamburger = document.getElementById('hamburgerMenu');
                    if (sidebar && !sidebar.contains(e.target) && hamburger && !hamburger.contains(e.target)) {
                        closeSidebar();
                    }
                }
            });
        });

        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
    </script>
    <script src="/register_sw.js"></script>
</body>

</html>
